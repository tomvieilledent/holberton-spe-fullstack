# /etc/nginx/snippets/vlldnt-security-headers.conf
# En-têtes de sécurité communs. `include` dans le bloc server ET dans chaque
# bloc location qui déclare son propre add_header (nginx n'hérite plus des
# add_header parents dès qu'un location en ajoute un).
# Référence versionnée (SSOT) — écrit tel quel par scripts/vps-setup.sh.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
