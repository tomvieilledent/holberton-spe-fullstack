# /etc/nginx/sites-available/vlldnt.fr.conf
# Vhost final (HTTPS). Écrit tel quel par scripts/vps-setup.sh une fois le
# certificat Let's Encrypt obtenu. Référence versionnée (SSOT).

# --- HTTP : renouvellement ACME + redirection vers HTTPS -------------------
server {
    listen 80;
    listen [::]:80;
    server_name vlldnt.fr www.vlldnt.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://vlldnt.fr$request_uri;
    }
}

# --- HTTPS : www -> apex --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vlldnt.fr;

    ssl_certificate     /etc/letsencrypt/live/vlldnt.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlldnt.fr/privkey.pem;

    return 301 https://vlldnt.fr$request_uri;
}

# --- HTTPS : le site ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vlldnt.fr;

    root /var/www/vlldnt.fr;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/vlldnt.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlldnt.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets fingerprintés par Vite : cache long et immuable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache (déploiements instantanés).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
